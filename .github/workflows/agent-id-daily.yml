# AI Agent / Agent ID 云端日更（交接包 2026-11-06，代码在 tools/agent-id-cloud）。
# 验收期只开 workflow_dispatch：旧任务（大叔电脑上 Codex 的 monitor-agent-id）停掉之前不加 cron（单时钟）。
# 切换时只加一条 `schedule: - cron: '20 0 * * *'`，别的不动。
# 发布：只提交 public/ai-agent/monitor，然后显式 dispatch daily.yml 重建 site/（GITHUB_TOKEN 的 push 不会触发别的 workflow），
# Cloudflare Pages 原生 Git 部署再从 daily.yml 的提交上线 site/。
# concurrency 单独一组：首轮回填可能跑几个小时，放进 daily-pipeline 会把排队的 L2/L3/L4/日历挤掉。
name: Agent ID daily data
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: agent-id-daily
  cancel-in-progress: false
jobs:
  update:
    # GitHub-hosted: no server, no self-hosted runner, no personal computer.
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # 2026-11-06 大叔同意：没有云端可用代理就直连（GitHub runner 连不上本机 localhost 代理）
      AGENT_ID_PROXY: ${{ secrets.AGENT_ID_PROXY || 'direct' }}
      # 节点：公共免费节点优先（按顺序，开跑前先探测能不能查 2026-10-20 的历史日志，不行的剔除），
      # 网站日更已在用的 Alchemy key 只兜底。单独配了 AGENT_ID_RPC_URL secret 就只用那一个。
      AGENT_ID_RPC_URL: ${{ secrets.AGENT_ID_RPC_URL }}
      AGENT_ID_RPC_PUBLIC: https://bsc-rpc.publicnode.com|https://bsc.drpc.org|https://1rpc.io/bnb|https://binance.llamarpc.com
      AGENT_ID_RPC_FALLBACK: ${{ secrets.ALCHEMY_KEY && format('https://bnb-mainnet.g.alchemy.com/v2/{0}', secrets.ALCHEMY_KEY) || '' }}
      AGENT_ID_LOG_CHUNK: '2000'   # 每次 getLogs 最多 2000 块（Alchemy 的上限，网站日更同样用 2000）
      AGENT_ID_STATE_KEY: ${{ secrets.AGENT_ID_STATE_KEY }}
      AGENT_ID_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      AGENT_ID_DEPLOY_WORKFLOW: ${{ vars.AGENT_ID_DEPLOY_WORKFLOW || 'daily.yml' }}   # 已核：daily.yml 有 workflow_dispatch，构建 main 最新提交
      AGENT_ID_NATIVE_GIT_DEPLOY: ${{ vars.AGENT_ID_NATIVE_GIT_DEPLOY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # job 级 env 不能用 runner 上下文（GitHub 会拒绝整个 workflow），私有运行目录在这里设
      - name: Private runtime directory outside the checkout
        run: echo "AGENT_ID_RUNTIME=$RUNNER_TEMP/agent-id-runtime" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require configured data and deployment paths
        shell: bash
        run: |
          missing=''
          [ -n "$AGENT_ID_PROXY" ] || missing="$missing AGENT_ID_PROXY"
          [ -n "$AGENT_ID_STATE_KEY" ] || missing="$missing AGENT_ID_STATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (names only; values never printed)"
            exit 1
          fi
          if [ -z "$AGENT_ID_DEPLOY_WORKFLOW" ] && [ "$AGENT_ID_NATIVE_GIT_DEPLOY" != true ]; then
            echo 'Configure existing website workflow_dispatch or verified Cloudflare native Git deployment.'
            exit 1
          fi
      - name: Install Chinese chart fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install collector dependencies
        run: python -m pip install -r tools/agent-id-cloud/requirements.txt
      - name: Restore encrypted full history
        run: python tools/agent-id-cloud/checkpoint.py restore --runtime "$AGENT_ID_RUNTIME"
      - name: Collect, verify and stage public data
        id: collect
        run: python tools/agent-id-cloud/run_cloud.py --runtime "$AGENT_ID_RUNTIME" --output public/ai-agent/monitor
      - name: Encrypt updated private state even when collection has gaps
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        id: snapshot
        run: python tools/agent-id-cloud/checkpoint.py pack --runtime "$AGENT_ID_RUNTIME" --output "$RUNNER_TEMP/runtime.enc"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        id: upload
        with:
          name: agent-id-encrypted-checkpoint
          path: ${{ runner.temp }}/runtime.enc
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Keep two complete encrypted checkpoints
        if: ${{ always() && steps.upload.outcome == 'success' }}
        run: python tools/agent-id-cloud/checkpoint.py prune
      - name: Commit only accepted public files
        if: ${{ success() && steps.collect.outcome == 'success' }}
        shell: bash
        run: |
          git config user.name 'agent-id-monitor[bot]'
          git config user.email 'agent-id-monitor@users.noreply.github.com'
          git add -- public/ai-agent/monitor
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: AI Agent daily $(date -u -d yesterday +%F)"
          git pull --rebase origin "$AGENT_ID_DEFAULT_BRANCH"
          git push origin "HEAD:$AGENT_ID_DEFAULT_BRANCH"
      - name: Trigger existing website publishing workflow
        if: ${{ success() && steps.collect.outcome == 'success' && env.AGENT_ID_DEPLOY_WORKFLOW != '' }}
        run: gh workflow run "$AGENT_ID_DEPLOY_WORKFLOW" --ref "$AGENT_ID_DEFAULT_BRANCH"
# Install exactly one new cron. The website workflow is dispatched, not rescheduled.
# GITHUB_TOKEN commits do not trigger other push workflows. Explicit dispatch closes that gap.
