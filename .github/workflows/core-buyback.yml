# 回购 / 销毁 12 个月链上数量（tools/core_mech/buyback.py，Alchemy）。main 上每周一跑一次（约 30–60 分钟，单独 concurrency 组，只提交 data/core/buyback.json，下一次出网站带上）；会话分支推送时试跑。
name: 回购销毁链上统计

on:
  push:
    branches: [claude/stoic-gates-xxol8a]
    paths:
      - "tools/core_mech/buyback.py"
      - ".github/workflows/core-buyback.yml"
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: core-buyback
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 统计
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
        run: python3 tools/core_mech/buyback.py | tail -c 3000
      - name: 提交结果
        run: |
          git config user.name "uncleonchain-bot"
          git config user.email "bot@uncleonchain.com"
          git add data/core/buyback.json
          git diff --cached --quiet && exit 0
          git commit -m "回购销毁统计 $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"
