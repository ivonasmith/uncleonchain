name: 日更：发射台 + 宏观四层 + 解读日志 + 网站发布

on:
  schedule:
    - cron: "40 3 * * *"       # 每天 UTC 03:40 先出一版（前一个 UTC 日已收盘；L2 / L3 / L4 排在它前面）
    - cron: "20 10 * * *"      # UTC 10:20 再跑一次：DefiLlama 昨日数据基本稳定，有补齐的按「补录」覆盖
    # 2026-11 起 GitHub 的定时触发常晚 6–8 小时，只有一个 10:20 时，前一天的数据要到北京时间次日凌晨才上线
  workflow_dispatch: {}         # 允许在 Actions 页面手动触发
  push:                         # 改了脚本 / 文章 / 点评 / 图标，推上来立刻重跑一次，不用等第二天
    branches: [main]
    paths:
      - "pipeline/**"
      - "content/**"
      - "assets/**"
      - "config/**"
      - "public/ai-agent/**"     # 大叔电脑上 Codex 的 monitor-agent-id 推新数据后立刻重建页面
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拿最新的 main，不用触发时的那一版：日更和 L2 排队跑，后跑的要建在先跑的提交上，否则 site/ 会冲突
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 中文字体：网站与图表用 Noto Sans/Serif CJK，Ubuntu runner 默认没装
      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      # 分享长图用的 html2canvas 自托管一份（国内访问 CDN 不稳），只在缺失时下载一次
      - name: 自托管 html2canvas
        run: |
          mkdir -p assets/vendor
          if [ ! -s assets/vendor/html2canvas.min.js ]; then
            curl -fsSL -o assets/vendor/html2canvas.min.js https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js \
              || curl -fsSL -o assets/vendor/html2canvas.min.js https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js \
              || echo "html2canvas 下载失败，页面会退回 CDN 加载"
          fi

      - name: 跑日更（拉数 → 看板 → 宏观 → 解读日志 → 网站）
        env:
          LP_DATA: ${{ github.workspace }}/data
          LP_OUT: ${{ github.workspace }}/build
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}                   # 新台线索：GitHub 代码搜索（只读）
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}       # 新台线索：查工厂合约名（Etherscan V2，一个 key 多链）
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}          # 链上新发射台：BSC / Base 只能走 Alchemy；Robinhood / Arc 公共节点失败时兜底
          # XAI_API_KEY: ${{ secrets.XAI_API_KEY }}         # 平台二级页面 AI 研究摘要（Grok）：大叔看过试写（try-notes.yml）再打开
        run: |
          python3 pipeline/跑日更.py --site

      - name: 提交 data/ 与 site/
        run: |
          git config user.name "uncleonchain-bot"
          git config user.email "bot@uncleonchain.com"
          git add data/ site/ assets/vendor/
          git diff --cached --quiet && echo "没有变化，跳过提交" && exit 0
          git commit -m "日更 $(date -u +%Y-%m-%d)"
          BASE=$(git rev-parse HEAD~1)   # 本次出网站用的代码版本
          git pull --rebase --autostash -X theirs origin main   # 万一中途有人推送：site/ 是生成物，以本次生成的为准
          # 运行期间别人推了代码：用最新代码重出一次网站再推，别拿旧代码出的页面盖掉新的（2026-11-10 出过）
          if ! git diff --quiet "$BASE" HEAD -- pipeline leg core alpha rwa config content assets; then
            LP_DATA="$GITHUB_WORKSPACE/data" LP_OUT="$GITHUB_WORKSPACE/build" python3 pipeline/出看板.py
            LP_DATA="$GITHUB_WORKSPACE/data" LP_OUT="$GITHUB_WORKSPACE/build" python3 pipeline/出网站.py
            git add site/ && (git diff --cached --quiet || git commit -m "重出网站（运行期间有代码更新）")
          fi
          git push
